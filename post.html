<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Artículo del blog | LegiLearn</title>

<!-- Esta página existía cuando los artículos se montaban con JavaScript desde
     post.html?p=slug. Ahora cada artículo es un fichero propio en /blog, así
     que esto sólo queda para que los enlaces antiguos sigan funcionando: no se
     indexa y redirige al artículo que corresponda. -->
<meta name="robots" content="noindex, follow">
<link rel="stylesheet" href="assets/styles.css">
<script>
  (function () {
    var slug = new URLSearchParams(location.search).get('p');
    var destino = slug && /^[a-z0-9-]+$/.test(slug) ? 'blog/' + slug + '.html' : 'blog.html';
    location.replace(destino);
  })();
</script>
</head>
<body style="background:#0a0a0b;color:#f5f5f5;font-family:system-ui,sans-serif">
  <main style="max-width:520px;margin:0 auto;padding:80px 24px;text-align:center">
    <h1 style="font-size:22px;margin-bottom:12px">Este artículo se ha mudado</h1>
    <p style="color:rgba(245,245,245,.7);line-height:1.6;margin-bottom:24px">
      Si no se te redirige automáticamente, entra desde el blog.
    </p>
    <a href="blog.html" style="color:#f5a623">Ir al blog</a>
  </main>
</body>
</html>
