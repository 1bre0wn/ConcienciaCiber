<script type="text/babel">
const { useState, useEffect, useRef } = React;

const LI = ({ name, className = 'w-4 h-4', fill = 'none', stroke }) => {
  const ref = React.useRef(null);
  React.useEffect(() => {
    if (!ref.current || !window.lucide) return;
    ref.current.innerHTML = '';
    const el = document.createElement('i');
    el.setAttribute('data-lucide', name);
    ref.current.appendChild(el);
    const attrs = { class: className, fill };
    if (stroke) attrs.stroke = stroke;
    window.lucide.createIcons({ attrs });
  }, [name, className, fill, stroke]);
  return <span ref={ref} className="inline-flex" />;
};

const useReveal = () => {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current; if (!el) return;
    const obs = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) { el.classList.add('in'); obs.unobserve(el); } });
    }, { threshold: 0.12 });
    obs.observe(el);
    return () => obs.disconnect();
  }, []);
  return ref;
};

const Reveal = ({ children, delay = 0, className = '', as = 'div' }) => {
  const ref = useReveal();
  const Tag = as;
  const d = delay ? ` reveal-d${delay}` : '';
  return <Tag ref={ref} className={`reveal${d} ${className}`}>{children}</Tag>;
};

  const [theme, setTheme] = useState(() => {
    try { return localStorage.getItem('ws-theme') || 'light'; } catch { return 'light'; }
  });
  useEffect(() => {
    document.body.setAttribute('data-theme', theme);
    try { localStorage.setItem('ws-theme', theme); } catch {}
  }, [theme]);
  return [theme, () => setTheme(t => t === 'light' ? 'dark' : 'light')];
};

                <button type="submit" disabled={status === 'sending'} className="w-full mt-6 bg-black text-white rounded-full px-6 py-4 font-medium hover:bg-gray-800 transition-colors flex items-center justify-center gap-2 disabled:opacity-60 disabled:cursor-not-allowed">
                  {status === 'sending' ? 'Enviando…' : <>Pedir demo + campaña gratis <LI name="arrow-right" className="w-4 h-4" stroke="white" /></>}
                </button>
                {status === 'error' && (
                  <div className="text-center mt-3 text-xs text-red-600">No se pudo enviar. Vuelve a intentarlo o escríbenos directamente a eperez@legitec.com.</div>
                )}
                <div className="text-center mt-4 text-xs text-gray-400 mono">O escribe a <a href="mailto:eperez@legitec.com" className="text-amber-700 hover:underline">eperez@legitec.com</a></div>
              </>)}
            </form>
          </Reveal>
        </div>
      </div>
    </section>
  );
};

const App = () => {
  const [theme, toggleTheme] = useTheme();
  // Al llegar desde otra página con ancla (p.ej. blog.html -> index.html#contacto),
  // el hash se resuelve antes de que React pinte las secciones: re-scroll tras el render.
  useEffect(() => {
    const hash = window.location.hash.replace('#', '');
    if (!hash) return;
    const go = () => {
      const el = document.getElementById(hash);
      if (el) el.scrollIntoView({ block: 'start' });
    };
    go();
    const t = setTimeout(go, 450);
    return () => clearTimeout(t);
  }, []);
  return (
    <div className="t-bg t-fg">
      <Nav theme={theme} toggleTheme={toggleTheme} />
      <Hero />
      <QueHacemos />
      <Practica />
      <Aprende />
      <Certifica />
      <Compliance />
      <Precios />
      <Testimonios />
      <Contacto />
      <Footer />
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
